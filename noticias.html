<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Notícias | NEFIP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body data-page="news">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <!-- CABEÇALHO: MONTADO POR assets/app.js -->
<div id="site-header">
  </div>
  <!-- CONTEÚDO PRINCIPAL DA PÁGINA -->
<main id="conteudo" class="page-main">
  <div class="wrap page-intro">
    <p class="eyebrow">ACOMPANHE O NEFIP</p>
    <h1>Notícias</h1>
    <p>Pesquisas, parcerias, eventos e resultados que aproximam conhecimento e gestão pública.</p>
  </div>
  <section class="wrap">
    <div id="featured-news">
    </div>
    <div class="filters">
      <label>
        <span class="sr-only">Buscar notícias</span>
        <input id="news-search" type="search" placeholder="Buscar notícias">
      </label>
      <select id="news-category" aria-label="Filtrar por categoria">
        <option value="">Todas as categorias</option>
      </select>
      <select id="news-year" aria-label="Filtrar por ano">
        <option value="">Todos os anos</option>
      </select>
    </div>
    <div class="card-grid news-grid" id="news-list">
    </div>
    <button class="load-more" id="news-more">Carregar mais</button>
  </section>
</main>
<!-- RODAPÉ: MONTADO POR assets/app.js -->
<div id="site-footer">
</div>
<div id="modal-root">
</div>
<button class="to-top" aria-label="Voltar ao topo">↑</button>
    <!-- DADOS E FUNCIONALIDADES COMPARTILHADAS -->
    <script src="assets/data.js">
    </script>
    <!-- ÍNDICE DE NOTÍCIAS: METADADOS E LINKS PARA AS PÁGINAS INDIVIDUAIS -->
    <script src="news/generated/index.js"></script>
    <script src="assets/app.js">
</script>
</body>
</html>
